name: Employee Management CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
      - "Helm/**"

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      ##################################################
      # Checkout
      ##################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ##################################################
      # Node Setup
      ##################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      ##################################################
      # Backend
      ##################################################

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: npm run build

      ##################################################
      # Frontend
      ##################################################

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      ##################################################
      # Docker Hub Login
      ##################################################

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      ##################################################
      # Build Backend Image
      ##################################################

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/employee-backend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/employee-backend:${{ github.sha }} \
            ./backend

      ##################################################
      # Build Frontend Image
      ##################################################

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/employee-frontend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/employee-frontend:${{ github.sha }} \
            ./frontend

      ##################################################
      # Push Backend Images
      ##################################################

      - name: Push Backend Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-backend:${{ github.sha }}

      ##################################################
      # Push Frontend Images
      ##################################################

      - name: Push Frontend Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-frontend:${{ github.sha }}