frontend:
  replicaCount: 2
  image:
    repository: employee-frontend
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

backend:
  replicaCount: 2
  image:
    repository: employee-backend
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  env:
    port: 3001
    dbHost: postgres-service
    dbPort: 5432
    dbName: devdb
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

postgres:
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  storage:
    size: 1Gi
    storageClassName: standard
  secret:
    user: devuser
    password: devpassword
    db: devdb

ingress:
  enabled: true
  className: nginx
  host: localhost