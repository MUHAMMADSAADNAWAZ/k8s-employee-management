apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-deployment
  namespace: devops-demo

spec:  
  replicas: 2

  selector:
    matchLabels:
      app: node

  template:    
    metadata:
      labels:  
        app: node

    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: node-configmap

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

          command:
            - sh
            - -c
            - |
              until pg_isready \
                -h "$DB_HOST" \
                -p "$DB_PORT" \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB"; do
                echo "Waiting for PostgreSQL at $DB_HOST:$DB_PORT/$POSTGRES_DB ..."
                sleep 2
              done
              echo "PostgreSQL is ready. Starting backend."

      containers:
      - name: node
        image: employee-backend:v1
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 3001

        envFrom:
          - configMapRef:
              name: node-configmap

        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER

          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD  

        resources:
           requests: 
             cpu: "100m"
             memory: "64Mi"
           limits: 
             cpu: "200m"  
             memory: "128Mi"

        livenessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
       
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 2
          periodSeconds: 5                  
          failureThreshold: 3