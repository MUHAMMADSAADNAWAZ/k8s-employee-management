apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-deployment
  namespace: devops-demo

spec:  
  replicas: 2

  selector:
    matchLabels:
      app: node

  template:    
    metadata:
      labels:  
        app: node

    spec:    
      containers:
      - name: node
        image: node-backend:v3
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 3001

        envFrom:
          - configMapRef:
              name: node-configmap

        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER

          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD  

        resources:
           requests: 
             cpu: "100m"
             memory: "64Mi"
           limits: 
             cpu: "200m"  
             memory: "128Mi"

        livenessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
       
        readinessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 2
          periodSeconds: 5                  